# Push to main -> the site on Hostinger is updated with rsync over SSH.
# rsync compares file contents and only sends what changed, over one encrypted connection.
#
# Stays OFF until these exist in the repo (Settings -> Secrets and variables -> Actions):
#   Secret:    SSH_PRIVATE_KEY  (private half of the deploy key; the public half is in hPanel -> SSH Access -> SSH keys)
#   Variable:  DEPLOY_ENABLED = true
# Optional variables (defaults = hPanel -> Advanced -> SSH Access):
#   SSH_HOST (77.37.37.35), SSH_USER (u628862379), SSH_PORT (65002),
#   REMOTE_DIR (domains/avicontravel.com/public_html/, relative to the SSH home)
#
# Files that exist only on the server are left alone (no --delete), so nothing
# like a Search Console verification file can be wiped by a deploy.

name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Sync changed files (rsync over SSH)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ vars.SSH_HOST || '77.37.37.35' }}
          SSH_USER: ${{ vars.SSH_USER || 'u628862379' }}
          SSH_PORT: ${{ vars.SSH_PORT || '65002' }}
          REMOTE_DIR: ${{ vars.REMOTE_DIR || 'domains/avicontravel.com/public_html/' }}
        run: |
          [ -n "$SSH_PRIVATE_KEY" ] || { echo "::error::Missing repository secret SSH_PRIVATE_KEY"; exit 1; }
          install -m 700 -d ~/.ssh
          # strip CRs in case the key was pasted from a Windows file
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # the host sometimes drops a connection; retry instead of failing the deploy
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 15 -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ] && break
            echo "ssh-keyscan attempt $i failed, retrying"; sleep 10
          done
          [ -s ~/.ssh/known_hosts ] || { echo "::error::Could not reach $SSH_HOST:$SSH_PORT"; exit 1; }
          for i in 1 2 3; do
            rsync -rlz --checksum --itemize-changes --chmod=D755,F644 \
              --exclude='.git*' --exclude='.github/' --exclude='_dev/' --exclude='.ftp-deploy-sync-state.json' \
              -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o ConnectTimeout=20" \
              ./ "$SSH_USER@$SSH_HOST:$REMOTE_DIR" && exit 0
            echo "rsync attempt $i failed, retrying"; sleep 15
          done
          echo "::error::rsync failed 3 times"; exit 1
