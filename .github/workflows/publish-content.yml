# "Publish" in the control panel (avicontravel.com/admin/) starts this workflow:
# Supabase content -> trip pages, cards, llms.txt, search, sitemap, titles & JSON-LD -> commit to main -> upload to Hostinger.
#
# Needs (Settings -> Secrets and variables -> Actions):
#   Secret:    SUPABASE_SERVICE_ROLE_KEY   (Supabase -> Project Settings -> API Keys -> service_role / secret key)
#   Variable:  SUPABASE_URL                (optional; defaults to the avicon-travel project)
# Started by the Supabase Edge Function "publish-site" (_dev/supabase/functions/publish-site).

name: Publish from control panel

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: publish_jobs.id in Supabase
        required: true

concurrency:
  group: cms-publish
  cancel-in-progress: false

permissions:
  contents: write

env:
  SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://tdpsvcsniftrgnrdyhgi.supabase.co' }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  JOB_ID: ${{ inputs.job_id }}
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check settings
        run: |
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || { echo "::error::Missing repository secret SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          pip install --quiet "pillow>=11,<13"

      - name: Write the changes into the site
        run: python _dev/cms/sync.py publish --job "$JOB_ID" --state "$RUNNER_TEMP/publish-state.json"

      - name: Commit to main
        id: commit
        run: |
          git config user.name "Avicon control panel"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "Publish from control panel (job $JOB_ID)"
          for i in 1 2 3; do
            git push -q origin HEAD:main && break
            [ "$i" = 3 ] && { echo "::error::Could not push to main"; exit 1; }
            git pull -q --rebase origin main
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Remember what is live
        run: python _dev/cms/sync.py save --job "$JOB_ID" --state "$RUNNER_TEMP/publish-state.json" --commit "${{ steps.commit.outputs.sha }}"

      - name: Report a stop
        if: failure()
        run: python _dev/cms/sync.py finish --job "$JOB_ID" --result failure --stage build

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  report:
    needs: [build, deploy]
    if: always() && needs.build.result == 'success' && needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          sparse-checkout: _dev/cms

      - name: Report the upload result
        run: python3 _dev/cms/sync.py finish --job "$JOB_ID" --result "${{ needs.deploy.result }}"
